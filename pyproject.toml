[tool.pyright]
extraPaths = ["backend"]
include = ["backend", "tests", "scripts"]
reportArgumentType = "none"
reportOptionalMemberAccess = "none"
reportAssignmentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"

[tool.ruff]
src = ["backend", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]
